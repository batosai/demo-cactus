[package]
name = "cactus-node"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
cactus-rs = { version = "0.3", features = ["image"] }
napi = { version = "3", features = ["serde-json", "tokio_rt"] }
napi-derive = "3"
serde_json = "1"
hound = "3.5"
tokio = { version = "1", features = ["rt"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
